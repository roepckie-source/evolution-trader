name: Evolution Trader - Evolution Run

on:
  workflow_dispatch:

jobs:
  evolution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check repository
        run: |
          echo "=============================================="
          echo "EVOLUTION TRADER"
          echo "=============================================="
          echo "Python:"
          python --version
          echo
          echo "Repository files:"
          ls -la
          echo
          echo "Workflow:"
          echo "Evolution run starting..."
          echo "=============================================="

      - name: Run Evolution Trader
        run: |
          python evolution.py
